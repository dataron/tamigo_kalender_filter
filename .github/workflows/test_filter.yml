name: Test Tamigo Filter

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run filter script (zonder commit)
        env:
          TAMIGO_URL: ${{ secrets.TAMIGO_URL }}
        run: |
          python filter_tamigo_ics.py
          ls -l
          cat tamigo_filtered.ics | head -n 50
