name: Update Tamigo Filtered ICS

on:
  schedule:
    - cron: "0 5 * * *"   # elke dag om 05:00 (UTC, maar dit is prima voor jouw use-case)
  workflow_dispatch:       # handmatig starten

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run filter script
        env:
          TAMIGO_URL: ${{ secrets.TAMIGO_URL }}
        run: |
          python filter_tamigo_ics.py

      - name: Commit updated ICS (alleen bij wijzigingen)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Check of er wijzigingen zijn in tamigo_filtered.ics
          if git diff --quiet tamigo_filtered.ics; then
            echo "Geen wijzigingen in tamigo_filtered.ics"
          else
            echo "Wijzigingen gevonden, committen..."
            git add tamigo_filtered.ics
            git commit -m "Update filtered ICS"
            git push
          fi
