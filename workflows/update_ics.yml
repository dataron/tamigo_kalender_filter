mainname: Update Tamigo ICS

on:
  schedule:
    - cron: "0 3 * * *"  # elk uur; pas aan naar bv. 0 3 * * * voor elke nacht om 03:00
  workflow_dispatch:      # handmatig starten via GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run filter script
        run: |
          python filter_tamigo_ics.py

      - name: Commit updated ICS
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tamigo_filtered.ics
          git commit -m "Update filtered ICS" || echo "No changes to commit"
          git push
