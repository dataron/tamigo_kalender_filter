on:
  workflow_dispatch:      # handmatig starten
  schedule:
    - cron: "0 * * * *"   # elk uur (pas aan zoals je wilt)

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Fetch raw ICS
        run: python fetch_raw.py

      - name: Commit raw ICS
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tamigo_raw.ics
          git commit -m "Update raw ICS" || echo "No changes"
          git push
